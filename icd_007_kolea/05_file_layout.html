<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><h3>File Layout</h3><figure><table><tr><td><strong>Format</strong></td><td>Delimited text file (.txt)</td></tr><tr><td><strong>Row Delimiter</strong></td><td>Newline (n)</td></tr><tr><td><strong>Column Delimiter</strong></td><td>Pipe (|)</td></tr><tr><td><strong>Text Qualifier</strong></td><td>Double Quote (<code>" "</code>)</td></tr><tr><td><strong>Column Names in First Row?</strong></td><td>Yes</td></tr><tr><td><strong>File Naming Convention</strong></td><td><code>TABLE_NAME_[Timestamp YYYYMMDDHHMMSS].txt</code></td></tr><tr><td><strong>Example</strong></td><td><code>S_CASE_20240320173915.txt</code></td></tr><tr><td><strong>File Naming Convention (with Sequence)</strong></td><td><code>TABLE_NAME_[Timestamp YYYYMMDDHHMMSS]_SEQ[SequenceNumber].txt</code></td></tr><tr><td><strong>Example (with Sequence)</strong></td><td><code>S_CASE_01_20240320173915.txt</code></td></tr><tr><td><strong>Encoding</strong></td><td>UTF-8</td></tr></table><figcaption>Table 1: Interface Specification Overview - KOLEA</figcaption></figure></body></html>
